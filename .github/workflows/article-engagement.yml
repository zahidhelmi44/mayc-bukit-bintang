name: Article engagement tests
on:
  pull_request:
    paths:
      - 'engagement-api/**'
      - 'src/scripts/*engagement*.ts'
      - 'src/scripts/site-analytics.ts'
      - 'src/components/Article*.astro'
      - 'src/components/EngagementAdmin.astro'
      - '.github/workflows/article-engagement.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test engagement-api/test/*.test.mjs
